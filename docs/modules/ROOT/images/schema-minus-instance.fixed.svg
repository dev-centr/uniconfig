<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img">
  <title>Schema minus instance</title>
  <rect width="960" height="360" fill="#f4f1eb"/>
  <rect x="40" y="40" width="420" height="280" fill="#fff" stroke="#1c1c1e" stroke-width="3"/>
  <text x="60" y="76" fill="#1c1c1e" font-family="Consolas, monospace" font-size="16">[user]</text>
  <text x="60" y="108" fill="#1c1c1e" font-family="Consolas, monospace" font-size="16">name = Ada</text>
  <text x="60" y="300" fill="#9a9690" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">On disk: two lines</text>
