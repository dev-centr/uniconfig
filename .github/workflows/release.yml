name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dev-centr/uniconfig-core
          path: uniconfig-core
      - uses: actions/checkout@v4
        with:
          repository: dev-centr/configui-binders
          path: configui-binders
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dew
          path: dlang-supplemental/dew
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dui
          path: dlang-supplemental/dui
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/vello-d
          path: dlang-supplemental/vello-d
      - uses: actions/checkout@v4
        with:
          path: uniconfig
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Build windowed
        working-directory: uniconfig
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE_ROOT="../dlang-supplemental/vello-d/vello_bridge"
          cargo build --release --manifest-path "$BRIDGE_ROOT/Cargo.toml"
          VELLO_BRIDGE_DIR="$(cd "$BRIDGE_ROOT/target/release" && pwd -W)"
          export VELLO_BRIDGE_DIR
          export DFLAGS="-L=${VELLO_BRIDGE_DIR}/vello_bridge.dll.lib"
          dub build --config=windowed --build=release --compiler=ldc2
          cp "${VELLO_BRIDGE_DIR}/vello_bridge.dll" .
      - name: Pack
        working-directory: uniconfig
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item uniconfig.exe dist/uniconfig-windows-amd64.exe
          Copy-Item vello_bridge.dll dist/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse fallback-catalog dist/fallback-catalog
          Compress-Archive -Path dist\* -DestinationPath uniconfig-windows-amd64.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            uniconfig/uniconfig-windows-amd64.zip
            uniconfig/dist/uniconfig-windows-amd64.exe
          generate_release_notes: true
